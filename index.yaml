schema_version: '1.0'
project: dok3search
updated: '2026-11-22'

implementation:
  repository: 'https://github.com/LeeYudok/dok3search'
  merged_phase: 'P3-complete'
  merged_phase_status: completed
  merged_reference: 'https://github.com/LeeYudok/dok3search/pull/70'
  design_copy_sync_reference: 'https://github.com/LeeYudok/dok3search/pull/66'
  index_schema_version: '2'
  local_search_backend: tantivy-persistent
  ephemeral_local_search_backend: tantivy-local
  fallback_search_backend: in-memory-fake
  local_source_env: DOK3_SOURCE_DIR
  local_data_env: DOK3_DATA_DIR
  refresh_interval_env: DOK3_REFRESH_INTERVAL_SECS
  admin_enable_env: DOK3_ENABLE_ADMIN
  mcp_transports:
    - 'POST /mcp'
    - '--mcp-stdio'
  admin_endpoints:
    - 'GET/POST /api/v1/index/jobs'
    - 'GET /api/v1/index/jobs/{job_id}'
    - 'GET/PATCH /api/v1/documents/{id}/classification'
    - 'GET/POST /api/v1/sources'
    - 'DELETE /api/v1/sources/{id}'
  ci_reference: 'https://github.com/LeeYudok/dok3search/pull/48'
  api_input_error_reference: 'https://github.com/LeeYudok/dok3search/pull/14'
  merged_crates:
    - 'dok3-domain (P0-2 PR #12; P3-1/P3-2/P3-3 IndexJobPort·ClassificationPort·SourceRegistryPort PR #65·#68·#70)'
    - 'dok3-storage (P1-2 PR #22·#27; P2-wiring PR #54; P3-2 원문 불변 put_immutable·update_metadata PR #68)'
    - 'dok3-parser (P1-1, PR #24)'
    - 'dok3-index (P1-3, PR #26; analyzer v2 통합 PR #56)'
    - 'dok3-connectors (P1-4a, PR #29)'
    - 'dok3-analyzer (P2-1, PR #31; index 통합 PR #56; P2-2 한국어 정규화 PR #61)'
    - 'dok3-agent (P2-5, PR #34; server/api 배선 PR #55)'
    - 'dok3-index-manager (P1-4b, PR #36; DOK3_DATA_DIR 배선 PR #54)'
    - 'dok3-benchmark (P2-6, PR #37; v2 비교 회귀 PR #56)'
    - 'dok3-search (P2-4 Knowledge Pack 자동 적재·UI/MCP self-search PR #62)'
    - 'dok3-api (P0-3 PR #12·#14; /mcp 배선 PR #55; P3-1/P3-2/P3-3 관리·분류·소스 API 및 루프백 가드 PR #65·#68·#70)'
    - 'dok3-server (tantivy-local PR #43·#46, tantivy-persistent PR #54, /mcp·--mcp-stdio PR #55, P3-1 증분 재수집·워커·작업 API PR #60·#65, P2-4 Knowledge Pack PR #62, P3-2 규칙 분류기·분류 저장소 PR #68, P3-3 다중 소스 레지스트리·부분 재스캔 PR #70)'
  bundled_references:
    issue: 'https://github.com/LeeYudok/dok3search/issues/21'
    category: guide
    topic_parameter: topic
    topics:
      rust:
        path: '/search?category=guide&topic=rust'
        chapters: 666
        sources:
          - 'Comprehensive Rust 한국어판: 337장'
          - 'Rust Book: 111장'
          - 'Rust Reference: 120장'
          - 'Cargo Book: 98장'
      go:
        path: '/search?category=guide&topic=go'
        chapters: 59
        sources:
          - 'Go 언어 명세'
          - 'Go Modules Reference'
          - 'Effective Go'

search_taxonomy:
  top_level_categories: [guide, manual, code, policy, design]
  topic_parameter: topic
  topics_by_category:
    guide: [rust, go]

entrypoints:
  - {id: index, title: 설계 인덱스, markdown: index.md, yaml: index.yaml}
  - {id: map, title: 전체 설계 맵, markdown: map.md, yaml: map.yaml}

document_tree:
  - id: entrypoints
    title: 설계 진입점
    files:
      - index.md
      - index.yaml
      - map.md
      - map.yaml
      - README.md
      - AGENTS.md
  - id: architecture
    title: 아키텍처와 구현 순서
    files:
      - dok3search-final-architecture.md
      - dok3search-implementation-roadmap.md
      - RUST_WORKSPACE_AND_CONTRACTS.md
      - REFERENCE_ARCHITECTURES.md
  - id: operations
    title: 운영과 사용 안내
    files:
      - BLUE_GREEN_OPERATIONAL_PROTOCOL.md
      - dok3search-network-deployment.md
      - dok3search-offline-supplychain.md
      - dok3search-subagents.md
      - dok3search-product-manual-draft.md
  - id: reviews
    title: 설계 검토와 변경 이력
    files:
      - DESIGN_REVIEW_AND_FIXES.md
      - BLUE_GREEN_DESIGN_REVIEW.md
      - CHANGELOG.md
      - dok3search-final-architecture-download.md
  - id: config
    title: 설정 예시
    files:
      - config/server.example.yaml
      - config/sources.example.yaml
      - config/indexing.example.yaml
      - config/index-generations.example.yaml
      - config/search-profiles.example.yaml
      - config/workspace.example.yaml
      - config/classification.example.yaml
      - config/reference-patterns.example.yaml
      - config/offline-bundle.example.yaml
  - id: contracts
    title: 데이터와 API 계약 예시
    files:
      - contracts/document.example.yaml
      - contracts/search-request.example.yaml
      - contracts/search-snapshot.example.yaml
      - contracts/section-read.example.yaml
      - contracts/index-job.example.yaml
      - contracts/index-operation.example.yaml
      - contracts/generation-transition.example.yaml
      - contracts/subagent-task.example.yaml
