schema_version: '1.0'
project: dok3search
updated: '2026-11-22'

implementation:
  repository: 'https://github.com/LeeYudok/dok3search'
  merged_phase: 'P1-4'
  merged_reference: 'https://github.com/LeeYudok/dok3search/pull/43'
  local_search_backend: tantivy-local
  fallback_search_backend: in-memory-fake
  local_source_env: DOK3_SOURCE_DIR
  ci_reference: 'https://github.com/LeeYudok/dok3search/pull/48'
  api_input_error_reference: 'https://github.com/LeeYudok/dok3search/pull/14'
  merged_crates:
    - 'dok3-storage (P1-2, PR #22·#27)'
    - 'dok3-parser (P1-1, PR #24)'
    - 'dok3-index (P1-3, PR #26)'
    - 'dok3-connectors (P1-4a, PR #29)'
    - 'dok3-analyzer (P2-1, PR #31)'
    - 'dok3-agent (P2-5, PR #34)'
    - 'dok3-index-manager (P1-4b, PR #36)'
    - 'dok3-benchmark (P2-6, PR #37)'
  bundled_references:
    issue: 'https://github.com/LeeYudok/dok3search/issues/21'
    category: guide
    topic_parameter: topic
    topics:
      rust:
        path: '/search?category=guide&topic=rust'
        chapters: 666
        sources:
          - 'Comprehensive Rust 한국어판: 337장'
          - 'Rust Book: 111장'
          - 'Rust Reference: 120장'
          - 'Cargo Book: 98장'
      go:
        path: '/search?category=guide&topic=go'
        chapters: 59
        sources:
          - 'Go 언어 명세'
          - 'Go Modules Reference'
          - 'Effective Go'

search_taxonomy:
  top_level_categories: [guide, manual, code, policy, design]
  topic_parameter: topic
  topics_by_category:
    guide: [rust, go]

entrypoints:
  - {id: index, title: 설계 인덱스, markdown: index.md, yaml: index.yaml}
  - {id: map, title: 전체 설계 맵, markdown: map.md, yaml: map.yaml}

document_tree:
  - id: entrypoints
    title: 설계 진입점
    files:
      - index.md
      - index.yaml
      - map.md
      - map.yaml
      - README.md
      - AGENTS.md
  - id: architecture
    title: 아키텍처와 구현 순서
    files:
      - dok3search-final-architecture.md
      - dok3search-implementation-roadmap.md
      - RUST_WORKSPACE_AND_CONTRACTS.md
      - REFERENCE_ARCHITECTURES.md
  - id: operations
    title: 운영과 사용 안내
    files:
      - BLUE_GREEN_OPERATIONAL_PROTOCOL.md
      - dok3search-network-deployment.md
      - dok3search-offline-supplychain.md
      - dok3search-subagents.md
      - dok3search-product-manual-draft.md
  - id: reviews
    title: 설계 검토와 변경 이력
    files:
      - DESIGN_REVIEW_AND_FIXES.md
      - BLUE_GREEN_DESIGN_REVIEW.md
      - CHANGELOG.md
      - dok3search-final-architecture-download.md
  - id: config
    title: 설정 예시
    files:
      - config/server.example.yaml
      - config/sources.example.yaml
      - config/indexing.example.yaml
      - config/index-generations.example.yaml
      - config/search-profiles.example.yaml
      - config/workspace.example.yaml
      - config/classification.example.yaml
      - config/reference-patterns.example.yaml
      - config/offline-bundle.example.yaml
  - id: contracts
    title: 데이터와 API 계약 예시
    files:
      - contracts/document.example.yaml
      - contracts/search-request.example.yaml
      - contracts/search-snapshot.example.yaml
      - contracts/section-read.example.yaml
      - contracts/index-job.example.yaml
      - contracts/index-operation.example.yaml
      - contracts/generation-transition.example.yaml
      - contracts/subagent-task.example.yaml
